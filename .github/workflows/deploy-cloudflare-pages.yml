name: Deploy production Cloudflare Pages
# Deploy Inbox-wide user discovery with conversation-independent live presence.
# Rebuild app-wide light/dark theme coverage for profile editor, profile panels, and admin panels.
# Include final inline-style contrast corrections for light-theme admin labels and dialogs.
# Keep Inbox labels and surfaces synchronized with the saved light/dark appearance setting.
# Deploy social-style avatar and cover photo crop previews and gallery-to-profile photo actions.
# Unify crop-editor appearance with saved app theme and exclude reserved avatar/cover assets from gallery.
# Restore Facebook-style drag, pinch-to-zoom, wheel-zoom, and reset controls in profile photo cropping.
# Add rule-of-thirds crop grid, remove position sliders, surface save errors, and harden WebP compression.
# Fix mobile image decoding fallback and change profile picture crop/display to a square.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest LiveMe source
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Point production app to the new Cloudflare Worker
        run: sed -i 's/omegle-signaling-server\.kafka9607\.workers\.dev/omegle-signaling-cloudflare.kafka9607.workers.dev/g' App.web.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Rebuild production from the configured source branch on every main update.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npx expo export --platform web

      - name: Ensure fresh production Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NAME="livme-production"
          PROJECT_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          STATUS=$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${PROJECT_URL}")
          if [ "${STATUS}" = "200" ]; then
            echo "Cloudflare Pages project ${PROJECT_NAME} already exists."
          elif [ "${STATUS}" = "404" ]; then
            echo "Creating Cloudflare Pages project ${PROJECT_NAME}..."
            npx wrangler pages project create "${PROJECT_NAME}" --production-branch=main
          else
            cat /tmp/pages-project.json
            echo "Unable to check Pages project (HTTP ${STATUS})."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy fresh production site
        run: npx wrangler pages deploy dist --project-name=livme-production --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

