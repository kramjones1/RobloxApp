name: Deploy LivMe production to Cloudflare Pages

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: livme-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Expo web app
        env:
          EXPO_PUBLIC_APP_VERSION: 1.0.0
          EXPO_PUBLIC_BUILD_ENV: production
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Deploy existing Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ffb9edd51f405ffd8029c14155f6e3e0
          command: pages deploy dist --project-name=livme-production --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
