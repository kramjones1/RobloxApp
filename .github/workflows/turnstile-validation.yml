name: Turnstile branch validation

on:
  push:
    branches:
      - feature/turnstile-auth
  pull_request:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web app
        run: npx expo export --platform web
